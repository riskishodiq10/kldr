<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estimasi Pengiriman Paket</title>
<style>
  :root {
    --bg: #f5f7fa; --card: #ffffff; --text: #1d2733; --muted: #6b7785;
    --accent: #1f6f8b; --border: #d9e0e7;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141a21; --card: #1d252e; --text: #e8edf2; --muted: #98a4b1; --accent: #5cb3cf; --border: #2f3a46; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
    background: var(--bg); color: var(--text);
    font-family: Georgia, "Times New Roman", serif;
  }
  main {
    width: 100%; max-width: 460px; background: var(--card);
    border: 1px solid var(--border); border-radius: 12px; padding: 28px;
  }
  h1 { font-size: 1.4rem; margin: 0 0 6px; }
  p.sub { margin: 0 0 20px; color: var(--muted); font-size: .95rem; line-height: 1.5; }
  label { display: block; margin-bottom: 6px; font-weight: bold; }
  input[type="date"], input[type="number"] {
    width: 100%; padding: 10px 12px; font-size: 1rem; margin-bottom: 16px;
    border: 1px solid var(--border); border-radius: 8px;
    background: var(--bg); color: var(--text); font-family: inherit;
  }
  input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  #hasil {
    margin-top: 8px; padding: 16px; border-left: 4px solid var(--accent);
    background: var(--bg); line-height: 1.6; display: none;
  }
</style>
</head>
<body>
<main>
  <h1>Estimasi Pengiriman Paket</h1>
  <p class="sub">Pilih tanggal pengiriman. Hanya hari kerja yang dihitung (Senin–Jumat, di luar libur nasional).</p>

  <label for="tanggal">Tanggal pengiriman</label>
  <input type="date" id="tanggal">

  <label for="lama">Lama pengiriman (hari kerja)</label>
  <input type="number" id="lama" value="3" min="1" max="60">

  <div id="hasil" role="status" aria-live="polite"></div>
</main>

<script>
  // Daftar libur nasional (format YYYY-MM-DD). Perbarui setiap tahun sesuai SKB 3 Menteri.
  const HARI_LIBUR = [
    "2026-12-25", // Natal
    "2026-12-24", // Cuti bersama Natal (contoh, sesuaikan)
    "2027-01-01", // Tahun Baru
    // Tambahkan tanggal libur lain di sini...
  ];

  const tanggalEl = document.getElementById("tanggal");
  const lamaEl = document.getElementById("lama");
  const hasilEl = document.getElementById("hasil");

  // Ubah Date menjadi "YYYY-MM-DD" memakai waktu lokal (bukan UTC)
  function keISO(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const t = String(d.getDate()).padStart(2, "0");
    return `${y}-${m}-${t}`;
  }

  function hariKerja(d) {
    const hari = d.getDay(); // 0 = Minggu, 6 = Sabtu
    return hari !== 0 && hari !== 6 && !HARI_LIBUR.includes(keISO(d));
  }

  // Tambah N hari kerja, dimulai dari hari kerja berikutnya setelah tanggal awal
  function tambahHariKerja(awal, n) {
    const d = new Date(awal);
    let terhitung = 0;
    while (terhitung < n) {
      d.setDate(d.getDate() + 1);
      if (hariKerja(d)) terhitung++;
    }
    return d;
  }

  const format = new Intl.DateTimeFormat("id-ID", {
    weekday: "long", day: "numeric", month: "long", year: "numeric"
  });

  function hitung() {
    if (!tanggalEl.value) { hasilEl.style.display = "none"; return; }
    const n = parseInt(lamaEl.value, 10);
    if (!n || n < 1) { hasilEl.style.display = "none"; return; }

    const [y, m, t] = tanggalEl.value.split("-").map(Number);
    const awal = new Date(y, m - 1, t);
    const tiba = tambahHariKerja(awal, n);

    hasilEl.textContent =
      `Paket yang dikirim pada ${format.format(awal)} diperkirakan tiba pada ` +
      `${format.format(tiba)}, yaitu ${n} hari kerja setelah tanggal pengiriman ` +
      `(tidak termasuk akhir pekan dan libur nasional).`;
    hasilEl.style.display = "block";
  }

  tanggalEl.addEventListener("change", hitung);
  lamaEl.addEventListener("input", hitung);
</script>
</body>
</html>
