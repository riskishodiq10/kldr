<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estimasi Pengemasan & Pengiriman</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f5f7fa; --card:#fff; --text:#1d2733; --muted:#6b7785; --accent:#1f6f8b; --accent-text:#fff;
          --border:#d9e0e7; --hol:#fde8e8; --hol-text:#a42a2a; --soft:#e8f1f5; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#141a21; --card:#1d252e; --text:#e8edf2; --muted:#98a4b1; --accent:#5cb3cf; --accent-text:#10202a;
            --border:#2f3a46; --hol:#3a2326; --hol-text:#f1a3a3; --soft:#24323d; }
  }
  * { box-sizing:border-box; }
  body { margin:0; padding:24px 16px; background:var(--bg); color:var(--text); font-family:"Open Sans",system-ui,Arial,sans-serif; }
  button, input, textarea { font-family:inherit; }
  .wrap { max-width:1000px; margin:0 auto; }
  body.home .wrap { min-height:calc(100vh - 48px); display:flex; flex-direction:column; justify-content:center; padding-bottom:12vh; }
  body.home h1 { text-align:center; font-size:1.6rem; }
  body.home p.sub { text-align:center; }
  h1 { font-size:1.3rem; margin:0 0 4px; }
  p.sub { margin:0 0 18px; color:var(--muted); font-size:.92rem; line-height:1.5; }
  [hidden] { display:none !important; }
  button { font-size:.9rem; cursor:pointer; color:var(--text); }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }

  .menu { display:grid; grid-template-columns:1fr 1fr; gap:16px; max-width:560px; width:100%; margin:0 auto; }
  @media (max-width:480px) { .menu { grid-template-columns:1fr; } }
  .menu button { padding:34px 16px; background:var(--card); border:1px solid var(--border); border-radius:12px; font-size:1.15rem; font-weight:600; }
  .menu button small { display:block; margin-top:6px; color:var(--muted); font-size:.82rem; font-weight:400; }
  .menu button:hover { border-color:var(--accent); }
  .back { background:none; border:0; color:var(--accent); padding:0; margin-bottom:10px; }

  .layout { display:grid; grid-template-columns:minmax(300px,370px) 1fr; gap:18px; align-items:start; }
  @media (max-width:820px) { .layout { grid-template-columns:1fr; } }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:18px; }
  .card h2 { font-size:1rem; margin:0 0 4px; }
  label.t { display:block; margin:14px 0 6px; font-weight:600; font-size:.86rem; }
  .card > label.t:first-of-type { margin-top:0; }

  .seg { display:flex; flex-wrap:wrap; gap:6px; }
  .seg button { padding:7px 11px; border:1px solid var(--border); border-radius:8px; background:var(--bg); }
  .seg button.on { background:var(--accent); color:var(--accent-text); border-color:var(--accent); }
  .stepper { display:flex; align-items:center; gap:8px; margin-top:8px; }
  .stepper button { width:30px; height:30px; border:1px solid var(--border); border-radius:8px; background:var(--bg); }
  .stepper input { width:76px; padding:6px 8px; text-align:center; border:1px solid var(--border); border-radius:8px; background:var(--bg); color:var(--text); font-size:.92rem; }
  .stepper span { color:var(--muted); font-size:.85rem; }

  .dd { position:relative; display:inline-block; max-width:100%; }
  .ddb { padding:8px 14px; border:1px solid var(--border); border-radius:999px; background:var(--bg); }
  .ddb:disabled { opacity:.5; cursor:default; }
  .ddl { position:absolute; left:0; top:calc(100% + 4px); z-index:20; min-width:100%; max-height:260px; overflow:auto;
         background:var(--card); border:1px solid var(--border); border-radius:12px; padding:4px; box-shadow:0 6px 18px rgba(0,0,0,.18); }
  .ddl button { display:block; width:100%; text-align:left; padding:8px 10px; border:0; background:none; border-radius:8px; white-space:nowrap; }
  .ddl button:hover, .ddl button.on { background:var(--soft); }

  .cal { width:100%; max-width:268px; border:1px solid var(--border); border-radius:10px; padding:8px; background:var(--bg); }
  .cal-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:4px; font-size:.86rem; }
  .cal-head button { width:26px; height:26px; border:1px solid var(--border); border-radius:6px; background:var(--card); padding:0; }
  .grid { display:grid; grid-template-columns:repeat(7,1fr); gap:2px; text-align:center; }
  .grid .dow { font-size:.7rem; color:var(--muted); padding:2px 0; }
  .grid button { height:28px; border:1px solid transparent; border-radius:6px; background:transparent; padding:0; font-size:.8rem; }
  .grid button.we { color:var(--muted); }
  .grid button.hol { background:var(--hol); color:var(--hol-text); }
  .grid button.today { border-color:var(--accent); }
  .grid button.sel { background:var(--accent); color:var(--accent-text); border-color:var(--accent); }
  .legend { font-size:.72rem; color:var(--muted); margin-top:5px; }

  .judul { color:var(--muted); font-size:.85rem; margin:0; }
  .tgl { font-size:1.3rem; font-weight:700; margin:4px 0 2px; }
  .info { color:var(--muted); font-size:.86rem; margin:0; line-height:1.5; }
  .hasil { padding:14px; border-left:4px solid var(--accent); background:var(--soft); border-radius:0 8px 8px 0; margin-bottom:16px; }
  textarea { width:100%; min-height:270px; padding:10px 12px; font-size:.9rem; line-height:1.55; border:1px solid var(--border);
    border-radius:8px; background:var(--bg); color:var(--text); resize:vertical; margin:6px 0 12px; }
  .primary { padding:9px 18px; border:0; border-radius:8px; background:var(--accent); color:var(--accent-text); }
  .warn { color:#b45309; font-size:.85rem; margin:8px 0 0; }
  .note { color:var(--muted); font-size:.8rem; }
</style>
</head>
<body class="home">
<div class="wrap">
  <h1>Estimasi Pengemasan & Pengiriman</h1>

  <!-- MENU AWAL -->
  <div id="vMenu">
    <p class="sub">Pilih jenis estimasi yang ingin dihitung.</p>
    <div class="menu">
      <button type="button" data-go="pack">Pengemasan<small>Normal, pre-order, request created</small></button>
      <button type="button" data-go="kirim">Pengiriman<small>Singapore, Malaysia, Philippines</small></button>
    </div>
  </div>

  <!-- PENGEMASAN -->
  <div id="vPack" hidden>
    <button class="back" type="button" data-go="menu">← Kembali ke menu</button>
    <div class="layout">
      <div class="card">
        <h2>Pengemasan</h2>
        <p class="note" style="margin:0 0 12px">Hari kerja dan libur Indonesia.</p>
        <label class="t">Jenis pengemasan</label>
        <div class="seg" id="segTipe"></div>

        <div id="boxPO" hidden>
          <label class="t">Lama pre-order (hari kerja)</label>
          <div class="seg" id="segPO"></div>
          <div class="stepper">
            <button type="button" id="poMin" aria-label="Kurangi">−</button>
            <input type="number" id="poInput" min="1" max="365" inputmode="numeric" aria-label="Lama pre-order">
            <button type="button" id="poPlus" aria-label="Tambah">+</button>
            <span>atau ketik sendiri</span>
          </div>
        </div>

        <div id="boxCut">
          <label class="t">Waktu pesanan masuk</label>
          <div id="ddCut"></div>
        </div>

        <div id="boxRC" hidden>
          <label class="t">Negara</label>
          <div id="ddRcNegara"></div>
          <label class="t">Jasa kirim</label>
          <div id="ddRcKurir"></div>
        </div>

        <label class="t" id="lblTglPack">Tanggal pesanan</label>
        <div id="calPack"></div>
      </div>

      <div class="card">
        <div class="hasil">
          <p class="judul">Maksimal paket dikirim</p>
          <p class="tgl" id="pTgl"></p>
          <p class="info" id="pInfo"></p>
        </div>
        <label class="t" for="pesanPack">Makro untuk buyer</label>
        <textarea id="pesanPack" readonly></textarea>
        <button class="primary" type="button" data-copy="pesanPack">Salin makro</button>
        <span class="note" data-ok="pesanPack"></span>
        <p class="note" id="pNote" style="margin-top:10px"></p>
        <p class="warn" id="pWarn"></p>
      </div>
    </div>
  </div>

  <!-- PENGIRIMAN -->
  <div id="vKirim" hidden>
    <button class="back" type="button" data-go="menu">← Kembali ke menu</button>
    <div class="layout">
      <div class="card">
        <h2>Pengiriman</h2>
        <p class="note" style="margin:0 0 12px">Hari kerja dan libur negara tujuan.</p>
        <label class="t">Negara</label>
        <div class="seg" id="segNegara"></div>
        <label class="t">Opsi pengiriman</label>
        <div id="ddOpsi"></div>
        <label class="t">Status paket</label>
        <div id="ddStatus"></div>
        <label class="t">Tanggal pengiriman <span class="note" id="hintPaid"></span></label>
        <div id="calKirim"></div>
      </div>

      <div class="card">
        <div class="hasil">
          <p class="judul">Maksimal paket sampai tujuan</p>
          <p class="tgl" id="kTgl"></p>
          <p class="info" id="kInfo"></p>
        </div>
        <label class="t" for="pesanKirim">Makro untuk buyer</label>
        <textarea id="pesanKirim" readonly></textarea>
        <button class="primary" type="button" data-copy="pesanKirim">Salin makro</button>
        <span class="note" data-ok="pesanKirim"></span>
        <p class="note" style="margin-top:10px">Bagian XXXXXXX dan nomor tracking diisi manual.</p>
        <p class="warn" id="kWarn"></p>
      </div>
    </div>
  </div>
</div>

<script>
/* =========================================================
   PENGATURAN: bagian ini yang diedit kalau ada perubahan
   Format tanggal: "YYYY-MM-DD". Cakupan data: 1 Nov 2026 s.d. 31 Des 2027.
   ========================================================= */
const COVER_FROM = "2026-11-01", COVER_TO = "2027-12-31";

const LIBUR = {
  ID: [ // SKB 3 Menteri (libur nasional + cuti bersama)
    "2026-12-24","2026-12-25",
    "2027-01-01","2027-01-05","2027-02-05","2027-02-06","2027-03-08","2027-03-09","2027-03-10","2027-03-11",
    "2027-03-12","2027-03-15","2027-03-25","2027-03-26","2027-03-28","2027-05-01","2027-05-06","2027-05-17",
    "2027-05-18","2027-05-19","2027-05-20","2027-06-01","2027-06-06","2027-08-15","2027-08-17",
    "2027-12-24","2027-12-25","2027-12-26"
  ],
  SG: [ // MOM Singapore
    "2026-11-09","2026-12-25",
    "2027-01-01","2027-02-06","2027-02-08","2027-03-10","2027-03-26","2027-05-01","2027-05-17","2027-05-20",
    "2027-08-09","2027-10-28","2027-12-25"
  ],
  MY: [ // Federal / Kuala Lumpur. Hari Raya & Deepavali masih tentatif
    "2026-11-09","2026-12-25",
    "2027-01-01","2027-02-01","2027-02-06","2027-02-07","2027-02-08","2027-02-24","2027-03-10","2027-03-11",
    "2027-05-01","2027-05-17","2027-05-20","2027-06-07","2027-08-16","2027-08-31","2027-09-16","2027-10-29",
    "2027-12-25"
  ],
  PH: [ // Proclamation 1006 (2026) & 1427 (2027). Eid'l Fitr/Adha belum ditetapkan
    "2026-11-02","2026-11-30","2026-12-08","2026-12-24","2026-12-25","2026-12-30","2026-12-31",
    "2027-01-01","2027-03-25","2027-03-26","2027-04-09","2027-05-01","2027-06-12","2027-08-30",
    "2027-11-01","2027-11-02","2027-11-30","2027-12-08","2027-12-24","2027-12-25","2027-12-31"
  ]
};

// Pengemasan normal & request created: tambahan hari kerja dari tanggal pesanan (0 = hari yang sama jika hari kerja)
const NORMAL_TAMBAH = { before: 0, after: 1 };
// Pre-order: tanggal paid + hari berikutnya = hari ke-1 (tanpa pembagian sebelum/sesudah jam 12)
const PO_PILIHAN = [3, 4, 5, 6, 7, 10, 30, 60, 90];

// Jasa kirim untuk makro request created
const KURIR = {
  PH: [ { nama:"SPX", url:"https://spx.ph/#/" },
        { nama:"Flash Express", url:"https://www.flashexpress.ph/tracking/" },
        { nama:"J&T", url:"https://www.jtexpress.ph/index/query/gzquery.html" } ],
  MY: [ { nama:"SPX", url:"https://spx.com.my/en" },
        { nama:"BEST", url:"https://www.best-inc.my/track" },
        { nama:"Jifee", url:"https://jifee.com/" } ],
  SG: [ { nama:"SPX", url:"https://spx.sg/#/" },
        { nama:"J&T", url:"https://jtsvip.jtexpress.sg/service/instanceExpressTrack" } ]
};

// Opsi pengiriman per negara. Urutan pertama = pilihan awal (Standard Internasional).
// n = hari kerja, cutoff = "before"/"after" (hanya 5DD). PH tidak punya 5DD.
const NEGARA = {
  SG: { nama:"Singapore", opsi:[
    { label:"Standard Internasional", n:25 },
    { label:"Doorstep Delivery", n:10 },
    { label:"5DD sebelum jam 2", n:5, cutoff:"before", dd5:true },
    { label:"5DD sesudah jam 2", n:5, cutoff:"after", dd5:true } ]},
  MY: { nama:"Malaysia", opsi:[
    { label:"Standard Internasional", n:25 },
    { label:"Doorstep Delivery", n:10 },
    { label:"5DD sebelum jam 2", n:5, cutoff:"before", dd5:true },
    { label:"5DD sesudah jam 2", n:5, cutoff:"after", dd5:true } ]},
  PH: { nama:"Philippines", opsi:[
    { label:"Standard Internasional & Doorstep", n:18 },
    { label:"Standard Local FBS", n:12 } ]}
};

// Makro pengemasan. m = tanggal maksimal (English), n = lama pre-order, url = link tracking jasa kirim
const MAKRO_NORMAL = (m) =>
`For now, your order with SN xxxx is will be packed. It takes 1 working days (Saturday and Sunday, Public Holiday are not included). Maximum your package will ship on ${m} But, it can be faster than the estimation.`;
const PESAN_PACK = {
  normal: (m) => MAKRO_NORMAL(m),
  po: (m, n) =>
`The product you are ordering is Pre-order ${n} working days not include Saturday and Sunday, or Public Holiday.

For now, your order with SN xxxx is will be packed. Maximum your package will ship on ${m} But, it can be faster than the estimation.😊👌🙏`,
  rc: (m, url) =>
`${MAKRO_NORMAL(m)}

Don't worry, your order is already packed. Your order has been integrated with the delivery service and can be tracked using the airwaybill number XXXXXXXXXXXXXX at ${url}. Currently, your order is waiting to be picked up by the courier. Please wait ya dear😊🙏🙏`
};

// Makro pengiriman. m = tanggal maksimal, c = nama negara. Opsi 5DD otomatis memakai makro "5dd".
const CS = "For detailed information you can contact Shopee Customer Service. 🙏";
const BACKLOG = "Please note that the delivery estimate may change due to operational queues or parcel backlog at the sorting center. 🙏";
const TEMPLATE = {
  "3pl-id": { nama:"3PL Indonesia", isi:(m)=>
`Since the delivery process is handled by the courier and not directly by our store/seller, we are unable to control or speed up the shipment, and our access to detailed delivery updates is limited. ${CS}

Your order has been shipped to the sorting center. Once the parcel arrives at the sorting center, please wait for the earliest estimated date, which is XXXXXXX, and the estimated maximum delivery date is ${m}.

${BACKLOG} Your order is still within the normal delivery timeframe provided by the courier service. Kindly wait patiently while your parcel is in transit. We truly appreciate your patience and understanding. 🙏🙏` },
  "warehouse": { nama:"Warehouse ID", isi:(m)=>
`Since the international shipping process is handled by the Courier/Delivery Service and not by the seller, we are unable to control the delivery progress. ${CS}

Your order is currently in the sorting process at Shopee's warehouse. Please wait for the earliest estimated date, which is XXXXXXX, and the estimated maximum delivery date is ${m}. The sorting process is carried out to ensure that the order is shipped in good condition, and the timeline may vary depending on the warehouse's operational queue. ${BACKLOG}

Your order is still within the normal delivery timeframe. Thank you for your patience and understanding. 🙏🙏` },
  "sls": { nama:"SLS / Handover", isi:(m)=>
`Since the international shipping process is handled by the Courier/Delivery Service and not by the seller, we are unable to control the delivery progress. ${CS}

Your order is currently in the sorting process for shipment to the destination country and is no longer located in Indonesia, and the order is still within the normal delivery estimate. Kindly allow time for the delivery process for the earliest estimated date, which is XXXXXXX, and the estimated maximum delivery date is ${m}. ${BACKLOG}

If your tracking still shows 'Jakarta', it only indicates the last recorded location before dispatch. Your parcel has already left Jakarta and is on its way to your country. 🙏 Your order is still within the normal delivery timeframe. We sincerely appreciate your patience and understanding while your parcel is in transit. 🙏🙏` },
  "3pl-overseas": { nama:"3PL Overseas", isi:(m,c)=>
`Since the international shipping process is handled by the Courier/Delivery Service and not by the seller, we are unable to control the delivery progress. ${CS}

Your order has arrived in ${c} and is now being handled by the local courier. You can track it using tracking number XXXXXXXXX via XXXXXXX. The earliest estimated delivery date is XXXXXXXX, and the maximum estimated delivery date is ${m}.

${BACKLOG} Your order is still within the normal delivery timeframe. Thank you for your patience and understanding. 🙏🙏` }
};
const MAKRO_5DD = (m) =>
`For now, your order with SN xxxx is already shipped. The delivery process from Indonesia takes 5 working days (It's not include Saturdays/Sundays/public holidays.) since it was sent by the seller and the maximum estimate you will receive is ${m}, you don't need to worry because it can be faster.♥️`;

/* =========================================================
   LOGIKA: biasanya tidak perlu diubah
   ========================================================= */
const $ = (id) => document.getElementById(id);
const CAL = Object.fromEntries(Object.entries(LIBUR).map(([k, v]) => [k, new Set(v)]));
const iso = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const isWork = (d, cal) => d.getDay() !== 0 && d.getDay() !== 6 && !cal.has(iso(d));
function addWD(d, n, cal) { const x = new Date(d); let k = 0; while (k < n) { x.setDate(x.getDate()+1); if (isWork(x, cal)) k++; } return x; }
const nextWD = (d, cal) => addWD(d, 1, cal);
function wdBetween(a, b, cal) { let k = 0; const x = new Date(a); while (x < b) { x.setDate(x.getDate()+1); if (isWork(x, cal)) k++; } return k; }
const outOfRange = (d) => iso(d) > COVER_TO || iso(d) < COVER_FROM;
const fID = new Intl.DateTimeFormat("id-ID", { weekday:"long", day:"numeric", month:"long", year:"numeric" });
const fEN = new Intl.DateTimeFormat("en-US", { day:"numeric", month:"long", year:"numeric" });
const fBulan = new Intl.DateTimeFormat("id-ID", { month:"long", year:"numeric" });
const today0 = () => { const t = new Date(); t.setHours(0,0,0,0); return t; };

/* Kalender klik */
function makeCalendar(el, getCal, onPick) {
  let view = today0(); view.setDate(1);
  let sel = today0();
  function render() {
    const cal = getCal(), y = view.getFullYear(), m = view.getMonth();
    const first = new Date(y, m, 1).getDay(), days = new Date(y, m+1, 0).getDate(), t = iso(today0());
    let h = `<div class="cal"><div class="cal-head"><button type="button" data-n="-1" aria-label="Bulan sebelumnya">‹</button>
      <b>${fBulan.format(view)}</b><button type="button" data-n="1" aria-label="Bulan berikutnya">›</button></div><div class="grid">`;
    ["Min","Sen","Sel","Rab","Kam","Jum","Sab"].forEach(d => h += `<div class="dow">${d}</div>`);
    for (let i = 0; i < first; i++) h += "<div></div>";
    for (let d = 1; d <= days; d++) {
      const dt = new Date(y, m, d), s = iso(dt), we = dt.getDay() === 0 || dt.getDay() === 6;
      const cls = [we ? "we" : "", cal.has(s) ? "hol" : "", s === t ? "today" : "", s === iso(sel) ? "sel" : ""].join(" ");
      h += `<button type="button" class="${cls}" data-d="${s}" ${cal.has(s) ? 'title="Libur"' : ""}>${d}</button>`;
    }
    el.innerHTML = h + `</div><div class="legend">Merah = libur, abu-abu = akhir pekan</div></div>`;
  }
  el.addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.n) { view.setMonth(view.getMonth() + Number(b.dataset.n)); render(); }
    if (b.dataset.d) { const [y,m,d] = b.dataset.d.split("-").map(Number); sel = new Date(y, m-1, d); render(); onPick(sel); }
  });
  render();
  return { get: () => sel, refresh: render };
}

/* Tombol pilihan (segmented) */
function seg(el, onChange) {
  el.addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) onChange(b.dataset.v); });
}
function fillSeg(el, items, cur) {
  el.innerHTML = items.map(([v, t]) => `<button type="button" data-v="${v}" class="${String(v) === String(cur) ? "on" : ""}">${t}</button>`).join("");
}

/* Dropdown bubble: satu tombol, pilihan muncul saat diklik */
function closeDD() { document.querySelectorAll(".ddl").forEach(l => l.hidden = true); }
function setDD(el, items, cur, disabled, labelOverride) {
  const found = items.find(([v]) => String(v) === String(cur)) || items[0];
  el.innerHTML = `<div class="dd"><button type="button" class="ddb" aria-haspopup="listbox" ${disabled ? "disabled" : ""}>${labelOverride || found[1]} ▾</button>
    <div class="ddl" role="listbox" hidden>${items.map(([v, t]) =>
      `<button type="button" role="option" data-v="${v}" class="${String(v) === String(cur) ? "on" : ""}">${t}</button>`).join("")}</div></div>`;
}
function onDD(el, onChange) {
  el.addEventListener("click", (e) => {
    const o = e.target.closest(".ddl button");
    if (o) { closeDD(); onChange(o.dataset.v); return; }
    const b = e.target.closest(".ddb");
    if (b) { const l = el.querySelector(".ddl"), wasHidden = l.hidden; closeDD(); l.hidden = !wasHidden; }
  });
}
document.addEventListener("click", (e) => { if (!e.target.closest(".dd")) closeDD(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeDD(); });

/* Navigasi menu */
const views = { menu:$("vMenu"), pack:$("vPack"), kirim:$("vKirim") };
document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-go]"); if (!b) return;
  Object.entries(views).forEach(([k, v]) => v.hidden = k !== b.dataset.go);
  document.body.classList.toggle("home", b.dataset.go === "menu");
  window.scrollTo(0, 0);
});

/* Salin */
document.addEventListener("click", async (e) => {
  const b = e.target.closest("[data-copy]"); if (!b) return;
  const ta = $(b.dataset.copy);
  try { await navigator.clipboard.writeText(ta.value); } catch { ta.select(); document.execCommand("copy"); }
  const ok = document.querySelector(`[data-ok="${b.dataset.copy}"]`);
  ok.textContent = " Tersalin"; setTimeout(() => ok.textContent = "", 1800);
});

/* ---------- PENGEMASAN ---------- */
const P = { tipe:"normal", cut:"before", po:30, rcNegara:"PH", rcKurir:0 };
const CUT_ITEMS = [["before", "Sebelum jam 12 siang"], ["after", "Sesudah jam 12 siang"]];

function hitungPack() {
  const sel = calPack.get(), cal = CAL.ID;
  fillSeg($("segTipe"), [["normal","Normal"],["po","Pre-order"],["rc","Request created"]], P.tipe);
  fillSeg($("segPO"), PO_PILIHAN.map(n => [n, n]), P.po);
  setDD($("ddCut"), CUT_ITEMS, P.cut);
  setDD($("ddRcNegara"), Object.entries(NEGARA).map(([k, c]) => [k, c.nama]), P.rcNegara);
  setDD($("ddRcKurir"), KURIR[P.rcNegara].map((k, i) => [i, k.nama]), P.rcKurir);
  if (document.activeElement !== $("poInput")) $("poInput").value = P.po;
  $("boxPO").hidden = P.tipe !== "po";
  $("boxCut").hidden = P.tipe === "po";
  $("boxRC").hidden = P.tipe !== "rc";
  $("lblTglPack").textContent = P.tipe === "po" ? "Tanggal paid" : "Tanggal pesanan";

  let max, info, msg, note = "";
  if (P.tipe === "po") {
    max = addWD(sel, P.po, cal); // hari berikutnya setelah paid = hari ke-1
    info = `Paid ${fID.format(sel)}. Hari berikutnya = hari ke-1, pre-order ${P.po} hari kerja.`;
    msg = PESAN_PACK.po(fEN.format(max), P.po);
  } else {
    const n = NORMAL_TAMBAH[P.cut];
    max = n === 0 ? (isWork(sel, cal) ? sel : nextWD(sel, cal)) : addWD(sel, n, cal);
    const waktu = `${P.cut === "before" ? "sebelum" : "sesudah"} jam 12 siang`;
    if (P.tipe === "normal") {
      info = `Pesanan ${fID.format(sel)}, ${waktu}, pengemasan normal.`;
      msg = PESAN_PACK.normal(fEN.format(max));
    } else {
      const k = KURIR[P.rcNegara][P.rcKurir];
      info = `Pesanan ${fID.format(sel)}, ${waktu}, request created (${NEGARA[P.rcNegara].nama}, ${k.nama}).`;
      msg = PESAN_PACK.rc(fEN.format(max), k.url);
      note = "Nomor airwaybill (XXXXXXXXXXXXXX) diisi manual.";
    }
  }
  $("pTgl").textContent = fID.format(max);
  $("pInfo").textContent = info;
  $("pesanPack").value = msg;
  $("pNote").textContent = note;
  $("pWarn").textContent = outOfRange(sel) || outOfRange(max) ? "Tanggal di luar data libur (Nov 2026 – Des 2027), hasil mungkin kurang akurat." : "";
}
const calPack = makeCalendar($("calPack"), () => CAL.ID, hitungPack);
seg($("segTipe"), v => { P.tipe = v; hitungPack(); });
seg($("segPO"), v => { P.po = Number(v); hitungPack(); });
onDD($("ddCut"), v => { P.cut = v; hitungPack(); });
onDD($("ddRcNegara"), v => { P.rcNegara = v; P.rcKurir = 0; hitungPack(); });
onDD($("ddRcKurir"), v => { P.rcKurir = Number(v); hitungPack(); });
$("poMin").addEventListener("click", () => { P.po = Math.max(1, P.po - 1); hitungPack(); });
$("poPlus").addEventListener("click", () => { P.po = Math.min(365, P.po + 1); hitungPack(); });
$("poInput").addEventListener("input", (e) => {
  const n = parseInt(e.target.value, 10);
  if (n >= 1 && n <= 365) { P.po = n; hitungPack(); }
});
$("poInput").addEventListener("blur", () => { $("poInput").value = P.po; });

/* ---------- PENGIRIMAN ---------- */
const K = { negara:"SG", opsi:0, status:"3pl-id" };
const opsiAktif = () => NEGARA[K.negara].opsi[K.opsi];

function hitungKirim() {
  const sel = calKirim.get(), cal = CAL[K.negara], o = opsiAktif(), t = today0();
  fillSeg($("segNegara"), Object.entries(NEGARA).map(([k, c]) => [k, c.nama]), K.negara);
  setDD($("ddOpsi"), NEGARA[K.negara].opsi.map((x, i) => [i, x.label]), K.opsi);
  setDD($("ddStatus"), Object.entries(TEMPLATE).map(([k, x]) => [k, x.nama]), K.status, !!o.dd5,
        o.dd5 ? "Otomatis (makro 5DD)" : "");
  $("hintPaid").textContent = o.dd5 ? "(isi tanggal paid)" : "";

  const base = o.cutoff === "after" ? nextWD(sel, cal) : sel;
  const max = addWD(base, o.n, cal);
  const sisa = max > t ? wdBetween(t, max, cal) : 0;
  $("kTgl").textContent = fID.format(max);
  $("kInfo").textContent = `${NEGARA[K.negara].nama}, ${o.label} (${o.n} hari kerja). Dikirim ${fID.format(sel)}. Sisa ${sisa} hari kerja dari hari ini.`;
  $("pesanKirim").value = o.dd5 ? MAKRO_5DD(fEN.format(max)) : TEMPLATE[K.status].isi(fEN.format(max), NEGARA[K.negara].nama);
  $("kWarn").textContent = outOfRange(sel) || outOfRange(max) ? "Tanggal di luar data libur (Nov 2026 – Des 2027), hasil mungkin kurang akurat." : "";
}
const calKirim = makeCalendar($("calKirim"), () => CAL[K.negara], hitungKirim);
seg($("segNegara"), v => { K.negara = v; K.opsi = 0; calKirim.refresh(); hitungKirim(); });
onDD($("ddOpsi"), v => { K.opsi = Number(v); hitungKirim(); });
onDD($("ddStatus"), v => { K.status = v; hitungKirim(); });

hitungPack(); hitungKirim();
</script>
</body>
</html>
