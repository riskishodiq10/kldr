<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estimasi Pengiriman Paket</title>
<style>
  :root { --bg:#f5f7fa; --card:#fff; --text:#1d2733; --muted:#6b7785; --accent:#1f6f8b; --border:#d9e0e7; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#141a21; --card:#1d252e; --text:#e8edf2; --muted:#98a4b1; --accent:#5cb3cf; --border:#2f3a46; }
  }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
         background:var(--bg); color:var(--text); font-family:Georgia,"Times New Roman",serif; }
  main { width:100%; max-width:480px; background:var(--card); border:1px solid var(--border);
         border-radius:12px; padding:28px; }
  h1 { font-size:1.4rem; margin:0 0 6px; }
  p.sub { margin:0 0 20px; color:var(--muted); font-size:.95rem; line-height:1.5; }
  label { display:block; margin-bottom:6px; font-weight:bold; }
  select, input[type="date"] { width:100%; padding:10px 12px; font-size:1rem; margin-bottom:16px;
         border:1px solid var(--border); border-radius:8px; background:var(--bg); color:var(--text); font-family:inherit; }
  select:focus-visible, input:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  #hasil { margin-top:8px; padding:16px; border-left:4px solid var(--accent); background:var(--bg);
           line-height:1.6; display:none; }
  #catatan { display:block; margin-top:10px; color:var(--muted); font-size:.9rem; }
</style>
</head>
<body>
<main>
  <h1>Estimasi Pengiriman Paket</h1>
  <p class="sub">Pilih tipe pengiriman dan tanggal. Hanya hari kerja yang dihitung.</p>

  <label for="tipe">Tipe pengiriman</label>
  <select id="tipe"></select>

  <label for="tanggal">Tanggal pengiriman</label>
  <input type="date" id="tanggal">

  <div id="hasil" role="status" aria-live="polite"></div>
</main>

<script>
  /* =====================================================
     PENGATURAN — bagian ini yang diedit kalau ada perubahan
     ===================================================== */

  // Libur nasional Indonesia (berlaku untuk SEMUA tipe). Format: "YYYY-MM-DD"
  const LIBUR_UMUM = [
    "2026-12-25",
    "2027-01-01",
    // tambahkan tanggal lain...
  ];

  // Aturan tiap tipe pengiriman.
  //  hari      : lama pengiriman dalam hari kerja
  //  hariKerja : hari yang dihitung (0=Minggu, 1=Senin, ... 6=Sabtu)
  //  libur     : libur tambahan khusus tipe ini (mis. libur negara tujuan)
  //  catatan   : teks tambahan di bawah hasil (boleh dikosongkan)
  // ANGKA DI BAWAH HANYA CONTOH, ganti sesuai SLA yang sebenarnya.
  const LAYANAN = {
    "3pl-id": {
      nama: "3PL ID",
      hari: 2,
      hariKerja: [1, 2, 3, 4, 5],
      libur: [],
      catatan: "Estimasi dihitung sejak paket diterima 3PL."
    },
    "warehouse": {
      nama: "Warehouse",
      hari: 1,
      hariKerja: [1, 2, 3, 4, 5],
      libur: [],
      catatan: ""
    },
    "sls": {
      nama: "SLS",
      hari: 3,
      hariKerja: [1, 2, 3, 4, 5, 6], // contoh: Sabtu tetap beroperasi
      libur: [],
      catatan: ""
    },
    "overseas": {
      nama: "Overseas",
      hari: 10,
      hariKerja: [1, 2, 3, 4, 5],
      libur: [], // isi libur negara tujuan di sini
      catatan: "Belum termasuk proses bea cukai di negara tujuan."
    }
  };

  /* =====================================================
     LOGIKA — biasanya tidak perlu diubah
     ===================================================== */

  const tipeEl = document.getElementById("tipe");
  const tanggalEl = document.getElementById("tanggal");
  const hasilEl = document.getElementById("hasil");

  for (const [kode, cfg] of Object.entries(LAYANAN)) {
    tipeEl.add(new Option(cfg.nama, kode));
  }

  function keISO(d) {
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  }

  function hariKerja(d, cfg) {
    const iso = keISO(d);
    return cfg.hariKerja.includes(d.getDay())
      && !LIBUR_UMUM.includes(iso)
      && !cfg.libur.includes(iso);
  }

  function tambahHariKerja(awal, cfg) {
    const d = new Date(awal);
    let n = 0;
    while (n < cfg.hari) {
      d.setDate(d.getDate() + 1);
      if (hariKerja(d, cfg)) n++;
    }
    return d;
  }

  const format = new Intl.DateTimeFormat("id-ID", {
    weekday: "long", day: "numeric", month: "long", year: "numeric"
  });

  function hitung() {
    if (!tanggalEl.value) { hasilEl.style.display = "none"; return; }
    const cfg = LAYANAN[tipeEl.value];
    const [y, m, t] = tanggalEl.value.split("-").map(Number);
    const awal = new Date(y, m - 1, t);
    const tiba = tambahHariKerja(awal, cfg);

    hasilEl.textContent =
      `Paket ${cfg.nama} yang dikirim pada ${format.format(awal)} diperkirakan tiba pada ` +
      `${format.format(tiba)}, yaitu ${cfg.hari} hari kerja setelah tanggal pengiriman ` +
      `(tidak termasuk hari libur dan akhir pekan sesuai ketentuan ${cfg.nama}).`;

    if (cfg.catatan) {
      const c = document.createElement("small");
      c.id = "catatan";
      c.textContent = cfg.catatan;
      hasilEl.appendChild(c);
    }
    hasilEl.style.display = "block";
  }

  tipeEl.addEventListener("change", hitung);
  tanggalEl.addEventListener("change", hitung);
</script>
</body>
</html>
